[project]
name = "decision-context-bench"
version = "0.1.0"
description = "Decision Context evaluation benchmark"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["ai", "decision-context", "evaluation", "benchmark"]

dependencies = [
    "cyclopts>=5.0.0a1",
    "openai>=1.75.0",
    "pydantic-ai>=0.1.0",
    "pyyaml>=6.0",
]

# The sample agents under examples/ pull in packages that the bench
# core does NOT need and that we deliberately keep out of the base
# dependency set so `uv sync` in CI stays clean:
#
#   - the Decision Context approach packages (doc_naive, doc_chunk,
#     hybrid_raw, lucid_dc, forge_dc) from the sibling
#     `decision-context-memory` repo — each sample agent imports one.
#   - `mem0ai` — used only by examples/agent_mem0.py, and transitively
#     pulls in `pytz` which is `MIT AND ZPL-2.1` and tends to fail
#     license-policy scans.
#
# To run the sample agents locally, install them separately after the
# main sync (each approach package is self-contained):
#     uv pip install mem0ai>=2.0.1
#     uv pip install -e ../decision-context-memory/doc_naive \
#                    -e ../decision-context-memory/doc_chunk \
#                    -e ../decision-context-memory/hybrid_raw \
#                    -e ../decision-context-memory/lucid_dc \
#                    -e ../decision-context-memory/forge_dc
#
# bench/core/usage.py reads BENCH_USAGE_MODULES and degrades gracefully
# when no approach package is installed, so the bench core still loads.
# The example agents fail at import time without these installed, which
# is expected and matches the documented usage.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20250915",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "B023",   # function definition does not bind loop variable
    "B905",   # zip without strict
    "SIM108", # ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["bench"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

