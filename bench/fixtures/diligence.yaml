    incorporation_date: "2022-12-15"
    good_standing: true
    litigation_pending: false
    litigation_history: "none"
    cap_table_clean: true
    cap_table_note: >
      Clean cap table with standard YC SAFE notes converted
      at seed. No unusual provisions or side letters. 409A
      valuation current as of Q3 2025.
    outstanding_options_pct: 15
    option_pool_remaining_pct: 8
  ip_portfolio:
    patents_filed: 2
    patents_granted: 0
    patents_note: >
      Two provisional patent applications filed for (1)
      automated anomaly detection methodology and (2)
      natural language to analytical query translation.
      Both pending. No granted patents yet.
    trademarks_registered: 1
    trademarks_note: "Delve wordmark registered in US"
    trade_secrets: >
      Proprietary query optimization algorithms and
      training data from customer analytics pipelines.
      Trade secret protection via employee NDAs and
      restricted access. No formal trade secret audit
      conducted.
    open_source_risk: "low"
    open_source_note: >
      Product uses standard open-source libraries
      (DuckDB, React, Python ML stack). No copyleft
      dependencies in core product. License audit
      conducted at seed stage.
  customer_references:
    total_references_available: 8
    reference_quality: "medium"
    reference_note: >
      8 customers agreed to serve as references. Quality
      is mixed -- mostly smaller accounts. Largest
      enterprise customer declined reference request
      (internal policy). Reference pool is adequate
      for seed stage but needs strengthening for Series A.
    sample_quotes:
      - source: "VP Analytics, mid-market SaaS company"
        quote: >
          Delve reduced our time-to-insight from days to
          minutes. The AI anomaly detection caught a
          revenue drop we would have missed for weeks.
      - source: "Head of Data, Series B fintech"
        quote: >
          Good product but onboarding was rough. Took
          3 weeks to get our data pipeline connected.
          Once running, the team loves it.
    customer_satisfaction_methodology: >
      Satisfaction data from NPS survey (n=28) and
      quarterly check-in calls with CSM team. Survey
      response rate of 74%. No formal CSAT score tracked.
  tech_debt_assessment:
    overall_rating: "moderate"
    codebase_age_months: 26
    test_coverage_pct: 62
    ci_cd_maturity: "moderate"
    deployment_frequency: "daily"
    mean_time_to_recovery_hours: 4
    tech_debt_note: >
      Moderate tech debt typical of fast-moving seed-stage
      startup. Main areas of concern: (1) data ingestion
      pipeline lacks proper error handling for edge cases,
      (2) authentication system needs rework for enterprise
      SSO, (3) monitoring and alerting are basic.
      Test coverage at 62% is below the 75% target.
    architecture_risks:
      - "Monolithic backend will need decomposition at scale"
      - "DuckDB dependency limits horizontal scalability"
      - "No multi-tenant data isolation (shared DB)"
    scalability_assessment: >
      Current architecture supports ~500 concurrent users.
      Will need significant rework to support enterprise-
      scale deployments. Migration to distributed query
      engine planned for Q2 2026.
  security_posture:
    soc2_type1: true
    soc2_type2: false
    soc2_type2_eta: "Q2 2026"
    iso27001: false
    hipaa: false
    gdpr_compliant: true
    gdpr_note: >
      GDPR compliant for EU customers. DPA template
      available. Data residency in US-East (no EU data
      center option yet). May need EU hosting for
      enterprise EU customers.
    penetration_test_date: "2025-06-15"
    penetration_test_findings: >
      Annual pentest by NCC Group. 2 medium findings
      (both remediated within 30 days). No critical
      findings. Next pentest scheduled Q2 2026.
    vulnerability_management: "automated scanning (Snyk)"
    encryption_at_rest: true
    encryption_in_transit: true
    mfa_enforced: true
    incident_response_plan: true
    incident_history: "no security incidents reported"
  compliance_status:
    frameworks:
      - name: "SOC 2 Type I"
        status: "certified"
        date: "2025-04-10"
      - name: "SOC 2 Type II"
        status: "in progress"
        eta: "Q2 2026"
      - name: "GDPR"
        status: "compliant"
        date: "2025-01-15"
    regulatory_risk: "low"
    regulatory_note: >
      Minimal direct regulatory risk. Indirect exposure
      through customer data handling. Main compliance
      gap is SOC 2 Type II, which many enterprise buyers
      require. Type II audit engagement signed.
  operational_notes: >
    Seed-stage company with expected operational maturity
    gaps. Main concerns: (1) no formal disaster recovery
    plan, (2) single-region deployment, (3) no dedicated
    security team. These are typical for stage and
    addressable with Series A funding.
  diligence_red_flags: []
  diligence_yellow_flags:
    - "SOC 2 Type II not yet achieved"
    - "Test coverage below 75% target"
    - "Single-region deployment"
    - "No dedicated security personnel"
  overall_diligence_rating: "pass with conditions"
  diligence_rating_note: >
    Acceptable for seed stage. Must address SOC 2 Type II
    and multi-region deployment before Series A. Technical
    debt is manageable but needs dedicated investment.
  data_confidence: "medium"
  data_sources: >
    SOC 2 Type I report, pentest report summary,
    engineering team interview, code repository metrics,
    legal document review
  last_updated: "2025-11-15"

