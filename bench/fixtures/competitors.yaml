# ---------------------------------------------------------------
# competitors.yaml
# Used by eval-analyst skill (source: 'competitors')
#
# Contains: direct and indirect competitors, threat level,
#   win rate data, competitive positioning, strengths/weaknesses,
#   and deal loss reasons. Deep competitive intelligence view.
# ---------------------------------------------------------------

delve.co:
  domain: "delve.co"
  competitive_landscape_summary: >
    Delve operates in a crowded analytics market transitioning
    from legacy BI to AI-native tools. Established players
    (Tableau, Looker, Power BI) are adding AI features while
    newer entrants (ThoughtSpot, Sigma) compete on modern
    architecture. Delve's window of differentiation is
    estimated at 18-24 months.
  direct_competitors:
    - name: "ThoughtSpot"
      domain: "thoughtspot.com"
      stage: "Late / Public-ready"
      arr_estimate: "$250M+"
      threat_level: "high"
      overlap_pct: 75
      strengths:
        - "Established enterprise customer base"
        - "Strong NLP search interface (pioneered category)"
        - "Deeper analytics capabilities"
      weaknesses:
        - "Legacy architecture, slower iteration"
        - "Higher price point excludes mid-market"
        - "UI feels dated compared to modern tools"
      differentiation_vs: >
        Delve's AI is generative (creates insights
        proactively) vs ThoughtSpot's search-based approach.
        Delve is 60% cheaper at mid-market price points.
    - name: "Sigma Computing"
      domain: "sigmacomputing.com"
      stage: "Series C"
      arr_estimate: "$80M"
      threat_level: "high"
      overlap_pct: 70
      strengths:
        - "Spreadsheet-like interface familiar to analysts"
        - "Strong cloud data warehouse integration"
        - "Well-funded ($300M+ raised)"
      weaknesses:
        - "Requires more technical setup than Delve"
        - "AI features are bolt-on, not native"
        - "Slower product iteration cycle"
      differentiation_vs: >
        Delve is AI-first; Sigma is spreadsheet-first
        adding AI. Delve targets less technical users
        who want answers, not pivot tables.
    - name: "Metabase"
      domain: "metabase.com"
      stage: "Series D"
      arr_estimate: "$40M"
      threat_level: "medium"
      overlap_pct: 55
      strengths:
        - "Open-source version creates wide funnel"
        - "Simple setup and self-serve deployment"
        - "Strong developer community"
      weaknesses:
        - "Limited AI capabilities"
        - "Not designed for large-scale analytics"
        - "Revenue model still maturing"
      differentiation_vs: >
        Delve provides automated insights that Metabase
        users must discover manually. Delve handles
        larger datasets more efficiently.
  indirect_competitors:
    - name: "Tableau (Salesforce)"
      domain: "tableau.com"
      threat_level: "medium"
      overlap_note: >
        Indirect because Tableau targets enterprise
        analysts who know SQL/viz; Delve targets less
        technical users. Overlap grows as Tableau
        adds AI features (Einstein Discovery).
    - name: "Looker (Google)"
      domain: "looker.com"
      threat_level: "medium"
      overlap_note: >
        Indirect competitor through Google Cloud.
        Looker's semantic layer could integrate AI
        search similar to Delve's approach. Gemini
        AI integration announced.
    - name: "ChatGPT Advanced Data Analysis"
      domain: "openai.com"
      threat_level: "medium-high"
      overlap_note: >
        Not a direct BI tool but increasingly used
        for ad-hoc data analysis. Existential risk
        if general AI assistants commoditize the
        insights layer.
  win_rate_overall_pct: 32
  win_rate_note: >
    Based on 85 tracked competitive opportunities in
    CRM over the past 6 months. Win rate is 32% across
    all competitors. Higher vs Metabase (48%) and
    lower vs ThoughtSpot (18%). Small sample size
    limits statistical confidence.
  win_rate_by_competitor:
    - competitor: "ThoughtSpot"
      win_rate_pct: 18
      sample_size: 22
    - competitor: "Sigma Computing"
      win_rate_pct: 28
      sample_size: 18
    - competitor: "Metabase"
      win_rate_pct: 48
      sample_size: 25
    - competitor: "Tableau"
      win_rate_pct: 35
      sample_size: 20
  primary_loss_reasons:
    - reason: "Feature gap (advanced visualizations)"
      frequency_pct: 35
    - reason: "Incumbent vendor renewal"
      frequency_pct: 28
    - reason: "Price (perceived value vs established tools)"
      frequency_pct: 20
    - reason: "Security/compliance requirements"
      frequency_pct: 17
  competitive_moat_durability: "12-18 months"
  competitive_moat_note: >
    AI advantage is real but temporary. ThoughtSpot and
    Sigma are investing heavily in AI features. Delve
    must build deeper integrations and workflow embedding
    to create durable differentiation before incumbents
    catch up.
  data_confidence: "medium"
  data_sources: >
    CRM opportunity data, G2 comparison reviews,
    Gartner Peer Insights, win/loss interviews (n=15),
    competitor product teardowns
  last_updated: "2025-11-15"

linear.app:
  domain: "linear.app"
  competitive_landscape_summary: >
    Linear competes in the issue tracking and project
    management space dominated by Jira (Atlassian). The
    market is undergoing a generational shift as engineering
    teams demand faster, better-designed tools. GitHub's
    expanding project management features represent the
    most significant long-term threat.
  direct_competitors:
    - name: "Jira (Atlassian)"
      domain: "atlassian.com"
      stage: "Public"
      arr_estimate: "$3B+ (Jira product line)"
      threat_level: "medium"
      overlap_pct: 90
      strengths:
        - "Massive installed base and enterprise contracts"
        - "Deep integrations with Atlassian ecosystem"
        - "Comprehensive feature set for large organizations"
      weaknesses:
        - "Widely considered slow and bloated"
        - "Complex configuration overwhelms small teams"
        - "User satisfaction scores are poor"
      differentiation_vs: >
        Linear wins on speed, UX, and simplicity. Jira
        wins on customization, enterprise features, and
        existing contracts. Migration friction is the
        main barrier -- once teams try Linear, most prefer
        it.
    - name: "Shortcut (formerly Clubhouse)"
      domain: "shortcut.com"
      stage: "Series B"
      arr_estimate: "$15M"
      threat_level: "medium"
      overlap_pct: 85
      strengths:
        - "Similar modern UX philosophy"
        - "Good API and integrations"
        - "Competitive pricing"
      weaknesses:
        - "Slower product development pace"
        - "Weaker brand recognition"
        - "Missing some power-user features"
      differentiation_vs: >
        Linear is faster and more opinionated. Shortcut
        is more flexible but less polished. Linear's
        brand is significantly stronger in the developer
        community.
    - name: "GitHub Issues/Projects"
      domain: "github.com"
      stage: "Public (Microsoft)"
      arr_estimate: "bundled (free for GitHub users)"
      threat_level: "high"
      overlap_pct: 60
      strengths:
        - "Free with GitHub subscription"
        - "Deepest code-to-issue integration possible"
        - "Massive existing user base"
        - "Microsoft resources behind development"
      weaknesses:
        - "Feature set is still basic vs Linear"
        - "UI/UX is not optimized for project management"
        - "Slow product iteration on project features"
      differentiation_vs: >
        Linear offers a purpose-built experience that
        GitHub Projects can't match yet. The risk is
        GitHub reaching "good enough" for most teams,
        eliminating the reason to pay for Linear.
  indirect_competitors:
    - name: "Asana"
      domain: "asana.com"
      threat_level: "low"
      overlap_note: >
        Asana targets general project management, not
        software development specifically. Overlap is
        primarily in cross-functional teams. Different
        buyer persona.
    - name: "ClickUp"
      domain: "clickup.com"
      threat_level: "low"
      overlap_note: >
        ClickUp is a general-purpose PM tool adding
        developer features. Broad but shallow approach
        vs Linear's deep, opinionated take.
    - name: "Notion Projects"
      domain: "notion.so"
      threat_level: "low-medium"
      overlap_note: >
        Notion's project management features are improving
        but not purpose-built for software development.
        Some teams use Notion for planning and Linear
        for execution.
  win_rate_overall_pct: 68
  win_rate_note: >
    Based on 340 tracked competitive evaluations over
    12 months. Win rate is exceptional at 68%. Linear
    almost always wins when the buyer is an engineering
    team. Losses are primarily in enterprise procurement
    where Jira has incumbent advantage.
  win_rate_by_competitor:
    - competitor: "Jira"
      win_rate_pct: 55
      sample_size: 150
    - competitor: "Shortcut"
      win_rate_pct: 78
      sample_size: 60
    - competitor: "GitHub Projects"
      win_rate_pct: 72
      sample_size: 80
    - competitor: "Asana"
      win_rate_pct: 82
      sample_size: 50
  primary_loss_reasons:
    - reason: "Enterprise Jira contract lock-in"
      frequency_pct: 42
    - reason: "GitHub Projects is free/bundled"
      frequency_pct: 25
    - reason: "Missing enterprise features (SSO, SCIM)"
      frequency_pct: 18
    - reason: "Price sensitivity (per-seat costs)"
      frequency_pct: 15
  competitive_moat_durability: "3-5 years"
  competitive_moat_note: >
    Linear's brand and UX advantage is durable. The main
    threat is GitHub Projects reaching parity (unlikely
    in < 3 years given Microsoft's slow iteration). Jira
    migration friction works in both directions -- hard
    to leave Jira, but also hard to leave Linear once
    adopted.
  data_confidence: "high"
  data_sources: >
    Company-reported win/loss data, G2 Grid, Gartner
    Peer Insights, developer surveys, Okta Businesses
    at Work
  last_updated: "2025-12-01"

notion.so:
  domain: "notion.so"
  competitive_landscape_summary: >
    Notion competes across multiple categories (docs, wikis,
    project management, databases) which makes competitive
    analysis complex. The primary threat is Microsoft
    bundling similar features into M365 at no additional
    cost. Notion's moat is flexibility and brand loyalty.
  direct_competitors:
    - name: "Coda"
      domain: "coda.io"
      stage: "Series D"
      arr_estimate: "$50M"
      threat_level: "medium"
      overlap_pct: 80
      strengths:
        - "More powerful data manipulation (formulas)"
        - "Better automation capabilities"
        - "Doc-first approach resonates with some teams"
      weaknesses:
        - "Much smaller user base and network effects"
        - "Steeper learning curve"
        - "Weaker brand recognition"
      differentiation_vs: >
        Notion wins on breadth and ecosystem. Coda wins
        on depth of doc-as-app functionality. Notion's
        larger community and template ecosystem create
        stronger network effects.
    - name: "Confluence (Atlassian)"
      domain: "atlassian.com"
      stage: "Public"
      arr_estimate: "$1B+ (Confluence product line)"
      threat_level: "medium-high"
      overlap_pct: 70
      strengths:
        - "Deep Jira integration for dev teams"
        - "Massive enterprise installed base"
        - "Atlassian ecosystem lock-in"
      weaknesses:
        - "Widely considered slow and cluttered"
        - "Search is notoriously poor"
        - "Modern UX is an afterthought"
      differentiation_vs: >
        Notion is universally considered a better product.
        Confluence wins on existing enterprise contracts
        and Jira integration. Teams migrate from
        Confluence to Notion, rarely the reverse.
    - name: "Microsoft Loop"
      domain: "microsoft.com"
      stage: "Public"
      arr_estimate: "bundled with M365"
      threat_level: "high"
      overlap_pct: 65
      strengths:
        - "Bundled free with M365 (billions of users)"
        - "Microsoft ecosystem integration"
        - "Enterprise IT approval is automatic"
      weaknesses:
        - "Feature set is immature vs Notion"
        - "Microsoft's track record on productivity"
        - "Less flexible than Notion's block architecture"
      differentiation_vs: >
        Notion is years ahead on product capabilities.
        Loop's threat is distribution, not product quality.
        If Loop reaches 70% of Notion's functionality,
        the free bundling becomes a serious threat.
  indirect_competitors:
    - name: "Google Docs/Sites"
      domain: "google.com"
      threat_level: "medium"
      overlap_note: >
        Google Docs is ubiquitous but lacks Notion's
        database and project features. Google is adding
        more structured data features that could increase
        overlap.
    - name: "Slite"
      domain: "slite.com"
      threat_level: "low"
      overlap_note: >
        Slite targets team knowledge bases specifically.
        Smaller, more focused competitor. Not a
        significant threat at Notion's scale.
    - name: "Obsidian"
      domain: "obsidian.md"
      threat_level: "low"
      overlap_note: >
        Local-first personal knowledge management.
        Competes at the individual user level, not
        team/enterprise. Different philosophy (files
        on disk vs cloud-native).
  win_rate_overall_pct: 72
  win_rate_note: >
    Based on 500+ enterprise sales opportunities tracked
    over 12 months. Notion wins most competitive
    evaluations but loses to Microsoft when IT mandates
    M365-only tooling.
  win_rate_by_competitor:
    - competitor: "Confluence"
      win_rate_pct: 78
      sample_size: 180
    - competitor: "Coda"
      win_rate_pct: 82
      sample_size: 90
    - competitor: "Microsoft Loop"
      win_rate_pct: 55
      sample_size: 120
    - competitor: "Google Workspace"
      win_rate_pct: 70
      sample_size: 110
  primary_loss_reasons:
    - reason: "Microsoft M365 bundling / IT mandate"
      frequency_pct: 38
    - reason: "Existing Confluence + Jira ecosystem"
      frequency_pct: 25
    - reason: "Security/compliance concerns"
      frequency_pct: 20
    - reason: "Learning curve / adoption resistance"
      frequency_pct: 17
  competitive_moat_durability: "3-5 years"
  competitive_moat_note: >
    Notion's data lock-in and brand moat are strong.
    Microsoft Loop is the most credible threat but is
    3+ years from feature parity. Notion AI provides
    additional differentiation that Microsoft Copilot
    is also pursuing.
  data_confidence: "high"
  data_sources: >
    Enterprise sales data, G2 Grid, Gartner MQ,
    customer advisory board feedback, industry surveys
  last_updated: "2025-10-20"

retool.com:
  domain: "retool.com"
  competitive_landscape_summary: >
    Retool defined the "internal tools" category and
    maintains clear leadership. Competition is primarily
    from open-source alternatives (Appsmith, Budibase) on
    the low end and general low-code platforms (OutSystems,
    Mendix) on the high end. AI code generation is a
    long-term category risk.
  direct_competitors:
    - name: "Appsmith"
      domain: "appsmith.com"
      stage: "Series B"
      arr_estimate: "$12M"
      threat_level: "medium"
      overlap_pct: 85
      strengths:
        - "Open-source (self-hosted free)"
        - "Growing developer community"
        - "Lower cost for budget-conscious teams"
      weaknesses:
        - "Missing enterprise features"
        - "Fewer native integrations"
        - "Smaller team, slower feature development"
      differentiation_vs: >
        Retool wins on enterprise features (SSO, audit
        logs, permissions), breadth of integrations
        (80+ vs 20+), and AI app builder. Appsmith
        competes on price and self-hosted simplicity.
    - name: "Superblocks"
      domain: "superblocks.com"
      stage: "Series B"
      arr_estimate: "$8M"
      threat_level: "medium"
      overlap_pct: 80
      strengths:
        - "Modern architecture and fast UI"
        - "Strong API workflow capabilities"
        - "Backed by Bessemer"
      weaknesses:
        - "Much smaller customer base"
        - "Narrower integration ecosystem"
        - "Brand recognition gap"
      differentiation_vs: >
        Retool is the established category leader with
        10x+ more customers. Superblocks is differentiated
        on workflow capabilities but lacks Retool's
        breadth and ecosystem.
    - name: "Airplane (acquired by Airtable)"
      domain: "airplane.dev"
      stage: "Acquired"
      arr_estimate: "N/A (acquired 2024)"
      threat_level: "low"
      overlap_pct: 70
      strengths:
        - "Clean developer-focused UX"
        - "Strong task/runbook capabilities"
        - "Now part of Airtable ecosystem"
      weaknesses:
        - "Post-acquisition uncertainty"
        - "Product direction may shift"
        - "Smaller feature set"
      differentiation_vs: >
        Airplane was the closest product competitor but
        its acquisition by Airtable reduced the direct
        threat. Airtable may integrate Airplane features
        into its platform, creating a different kind of
        competitor.
  indirect_competitors:
    - name: "OutSystems"
      domain: "outsystems.com"
      threat_level: "low"
      overlap_note: >
        Enterprise low-code platform. Different buyer
        (IT department vs engineering team). Much
        more expensive and complex. Targets external-
        facing applications, not internal tools.
    - name: "v0 / Cursor (AI code generation)"
      domain: "v0.dev"
      threat_level: "medium"
      overlap_note: >
        Long-term existential risk. If AI can generate
        custom internal tools from natural language,
        the low-code category may shrink. Retool is
        mitigating by adding AI app generation.
    - name: "Streamlit"
      domain: "streamlit.io"
      threat_level: "low"
      overlap_note: >
        Python-based internal tool builder for data teams.
        Narrower use case but popular among data scientists.
        Now part of Snowflake.
  win_rate_overall_pct: 72
  win_rate_note: >
    Based on 420 tracked competitive deals over 12 months.
    Retool wins 72% of competitive evaluations. Win rate
    is highest in enterprise and lowest in small startups
    where open-source is preferred.
  win_rate_by_competitor:
    - competitor: "Appsmith"
      win_rate_pct: 65
      sample_size: 120
    - competitor: "Superblocks"
      win_rate_pct: 78
      sample_size: 80
    - competitor: "Budibase"
      win_rate_pct: 82
      sample_size: 60
    - competitor: "Build in-house"
      win_rate_pct: 58
      sample_size: 160
  primary_loss_reasons:
    - reason: "Open-source preference (cost)"
      frequency_pct: 35
    - reason: "Decision to build in-house"
      frequency_pct: 30
    - reason: "Pricing (per-seat model too expensive)"
      frequency_pct: 20
    - reason: "Missing specific integration"
      frequency_pct: 15
  competitive_moat_durability: "3-5 years"
  competitive_moat_note: >
    Retool's category leadership, 80+ integrations, and
    enterprise customer base create durable advantages.
    Open-source is a constant pressure but enterprise
    features justify the premium. AI app generation
    could extend or erode the moat depending on execution.
  data_confidence: "high"
  data_sources: >
    Company-reported win/loss, G2 Grid, Forrester Wave,
    developer community surveys, competitive deal reviews
  last_updated: "2025-12-10"

resend.com:
  domain: "resend.com"
  competitive_landscape_summary: >
    Resend operates in the mature transactional email
    market dominated by SendGrid (Twilio), Amazon SES,
    and Mailgun (Sinch). The market is largely commodity
    but Resend bets that developer experience creates
    meaningful differentiation. SendGrid's post-Twilio
    quality decline has opened a window.
  direct_competitors:
    - name: "SendGrid (Twilio)"
      domain: "sendgrid.com"
      stage: "Public (Twilio subsidiary)"
      arr_estimate: "$500M+"
      threat_level: "medium"
      overlap_pct: 90
      strengths:
        - "Massive scale and deliverability infrastructure"
        - "Established enterprise customer base"
        - "Combined with Twilio's communication stack"
      weaknesses:
        - "Quality and reliability have degraded post-Twilio"
        - "Developer experience is dated"
        - "Support quality has declined significantly"
      differentiation_vs: >
        Resend wins on DX, documentation, and modern API
        design. SendGrid wins on scale, enterprise
        features, and existing contracts. The quality
        decline at SendGrid is Resend's primary market
        opening.
    - name: "Postmark"
      domain: "postmarkapp.com"
      stage: "Bootstrapped / ActiveCampaign"
      arr_estimate: "$25M"
      threat_level: "medium"
      overlap_pct: 85
      strengths:
        - "Best-in-class deliverability"
        - "Strong reputation for reliability"
        - "Focused exclusively on transactional email"
      weaknesses:
        - "No modern component-based email building"
        - "API design is older generation"
        - "Limited marketing email capabilities"
      differentiation_vs: >
        Resend differentiates through React Email
        components and modern DX. Postmark has better
        deliverability reputation but Resend is
        closing the gap rapidly.
    - name: "Loops"
      domain: "loops.so"
      stage: "Seed"
      arr_estimate: "$5M"
      threat_level: "medium"
      overlap_pct: 50
      strengths:
        - "Modern UI for email campaigns"
        - "Strong indie/startup community"
        - "Good developer ergonomics"
      weaknesses:
        - "More focused on marketing than transactional"
        - "Smaller scale and reliability track record"
        - "Less API-focused"
      differentiation_vs: >
        Different primary use case. Loops is marketing
        email, Resend is transactional. Some overlap
        as both expand scope. Potential for bundling
        competition.
  indirect_competitors:
    - name: "Amazon SES"
      domain: "aws.amazon.com/ses"
      threat_level: "high"
      overlap_note: >
        Amazon SES is the lowest-cost option and
        Resend actually uses SES under the hood. SES is
        "email infrastructure" while Resend is "email
        DX." If developers are willing to do the setup
        work, SES is much cheaper.
    - name: "Mailgun (Sinch)"
      domain: "mailgun.com"
      threat_level: "low"
      overlap_note: >
        Once a strong developer email tool, Mailgun has
        declined in quality since Sinch acquisition.
        Similar trajectory to SendGrid post-acquisition.
    - name: "Plunk"
      domain: "useplunk.com"
      threat_level: "low"
      overlap_note: >
        Open-source email platform. Very early but
        could compete on cost for self-hosted deployments.
  win_rate_overall_pct: 55
  win_rate_note: >
    Based on limited tracking (mostly inbound PLG). Win
    rate is estimated from developer survey data and
    GitHub discussions, not formal CRM tracking. Resend
    wins when developer experience is the primary buying
    criterion.
  win_rate_by_competitor:
    - competitor: "SendGrid"
      win_rate_pct: 62
      sample_size: 40
      note: "among new evaluations only; existing SendGrid renewal rate is high"
    - competitor: "Postmark"
      win_rate_pct: 45
      sample_size: 25
    - competitor: "Amazon SES"
      win_rate_pct: 38
      sample_size: 30
    - competitor: "Mailgun"
      win_rate_pct: 72
      sample_size: 20
  primary_loss_reasons:
    - reason: "Price (SES is much cheaper)"
      frequency_pct: 35
    - reason: "Deliverability concerns (newer platform)"
      frequency_pct: 28
    - reason: "Scale limitations (enterprise volume)"
      frequency_pct: 22
    - reason: "Existing vendor relationship"
      frequency_pct: 15
  competitive_moat_durability: "12-18 months"
  competitive_moat_note: >
    DX differentiation is real but reproducible. React
    Email open-source community creates some lock-in.
    Email infrastructure is ultimately commodity. Must
    build scale and reliability reputation to create
    durable moat.
  data_confidence: "medium"
  data_sources: >
    Developer survey data, G2 reviews, GitHub star
    comparison, npm download trends, Hacker News
    sentiment analysis
  last_updated: "2025-11-28"

meridian.bio:
  domain: "meridian.bio"
  competitive_landscape_summary: >
    The AI drug discovery market is highly competitive
    with well-funded players (Recursion, Insitro) and
    large pharma building in-house capabilities. Meridian
    differentiates as a platform-only company that doesn't
    compete with its pharma customers on drug programs.
    This positioning is a key strategic advantage.
  direct_competitors:
    - name: "Elucidata"
      domain: "elucidata.io"
      stage: "Series B"
      arr_estimate: "$12M"
      threat_level: "high"
      overlap_pct: 75
      strengths:
        - "Multi-omics data platform (similar positioning)"
        - "Larger team and more funding"
        - "Strong academic partnerships"
      weaknesses:
        - "Less advanced ML models"
        - "No wet-lab validation capability"
        - "Weaker pharma industry relationships"
      differentiation_vs: >
        Meridian's wet-lab validation loop is the key
        differentiator. Elucidata is software-only.
        Meridian's proprietary models (protein folding)
        outperform Elucidata's on benchmarks.
    - name: "BenchSci"
      domain: "benchsci.com"
      stage: "Series D"
      arr_estimate: "$30M"
      threat_level: "medium"
      overlap_pct: 55
      strengths:
        - "Larger customer base and revenue"
        - "Strong literature mining capabilities"
        - "Well-funded ($100M+ raised)"
      weaknesses:
        - "Focused on literature, not computational biology"
        - "No predictive modeling capabilities"
        - "Different core value proposition"
      differentiation_vs: >
        Meridian is computational biology; BenchSci is
        research literature intelligence. Overlap is
        in the pharma R&D buyer but use cases differ.
    - name: "Insitro"
      domain: "insitro.com"
      stage: "Series C"
      arr_estimate: "$20M (est., mostly partnerships)"
      threat_level: "medium"
      overlap_pct: 60
      strengths:
        - "Massive dataset from cellular biology"
        - "Well-funded ($700M+ raised)"
        - "Strong ML talent (led by Daphne Koller)"
      weaknesses:
        - "Drug developer model competes with pharma"
        - "Platform not available as standalone product"
        - "Burns cash faster as hybrid drug company"
      differentiation_vs: >
