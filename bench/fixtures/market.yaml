delve.co:
  domain: "delve.co"
  tam: "48000000000"
  tam_formatted: "$48B"
  sam: "6200000000"
  sam_formatted: "$6.2B"
  som: "120000000"
  som_formatted: "$120M"
  tam_methodology: >
    TAM based on global business analytics and BI market
    (Gartner 2025 estimate). SAM narrowed to AI-native
    analytics for mid-market companies (500-5000 employees)
    in North America and Europe. SOM reflects realistic
    5-year capture rate given competitive intensity.
  market_position: "emerging challenger"
  market_share_pct: "0.002"
  category: "AI-native analytics"
  primary_segment: "mid-market B2B"
  geographic_focus: "North America"
  competitors:
    - name: "ThoughtSpot"
      overlap: "high"
      relative_size: "much larger"
    - name: "Sigma Computing"
      overlap: "high"
      relative_size: "larger"
    - name: "Mode Analytics"
      overlap: "medium"
      relative_size: "larger"
    - name: "Metabase"
      overlap: "medium"
      relative_size: "similar"
  competitive_note: >
    Delve differentiates through natural-language query
    interface and automated insight generation. Most
    competitors still require SQL knowledge or drag-and-
    drop configuration. However, incumbents (Tableau,
    Looker) are rapidly adding AI features.
  differentiation:
    - "Natural language data exploration (no SQL needed)"
    - "Automated anomaly detection and root cause analysis"
    - "Sub-second query performance on datasets up to 10TB"
    - "Purpose-built for product and growth analytics"
  moat_assessment: >
    Weak moat currently. Technology differentiation is
    real but reproducible. No significant data network
    effects or switching costs yet. Must build moat
    through integrations and workflow embedding before
    incumbents catch up on AI features.
  market_trends:
    - trend: "AI-first analytics replacing legacy BI"
      impact: "strong positive"
      timeframe: "2024-2028"
    - trend: "Data democratization in mid-market"
      impact: "positive"
      timeframe: "2025-2027"
    - trend: "Consolidation of analytics stack"
      impact: "negative"
      timeframe: "2026-2028"
  regulatory_landscape: >
    Minimal direct regulation. Indirect exposure through
    customer data handling requirements (SOC 2, GDPR).
    Company has SOC 2 Type I; Type II in progress.
  market_timing: "favorable"
  market_timing_note: >
    Strong timing as AI-native tools gain acceptance in
    enterprise. Window of opportunity is 18-24 months
    before incumbents fully integrate AI capabilities.
  data_confidence: "medium"
  data_sources: >
    Gartner BI market report (2025), company pitch deck,
    competitor analysis from Forrester Wave, G2 reviews
  last_updated: "2025-11-15"

