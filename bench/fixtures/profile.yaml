    - category: "competitive"
      severity: "medium"
      description: >
        GitHub Projects is free and improving. If GitHub
        reaches parity on core features, Linear's premium
        pricing is at risk.
    - category: "market_ceiling"
      severity: "medium"
      description: >
        Issue tracking TAM may be smaller than estimated.
        Expansion beyond core product is needed for
        continued high growth.
    - category: "pricing"
      severity: "low"
      description: >
        Per-seat pricing faces pressure as companies
        optimize headcount. Usage-based alternatives
        may emerge.
  investment_thesis: >
    Best-in-class developer tool with exceptional unit
    economics. Dominant brand in a growing category.
    Must expand TAM through product adjacencies (project
    management, documentation) to sustain growth at scale.
  key_metrics_to_watch:
    - "Enterprise revenue mix (target: 40%+ by 2027)"
    - "Product expansion revenue (new modules)"
    - "GitHub Projects competitive trajectory"
    - "International revenue growth"
  data_confidence: "high"
  data_sources: >
    Secondary market data, investor briefings, G2 review
    analysis, NPS survey data, Pitchbook
  last_updated: "2025-12-01"

