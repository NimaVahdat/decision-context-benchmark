#   customer metrics, churn, risk factors, and qualitative
#   assessments. Serves as the "investment profile" view.
# ---------------------------------------------------------------

delve.co:
  domain: "delve.co"
  overall_score: 72
  score_methodology: >
    Weighted composite: growth (30%), unit economics (25%),
    team (20%), market (15%), product (10%). Scores on
    0-100 scale. Peer-adjusted for stage (Seed).
  growth_score: 85
  unit_economics_score: 68
  team_score: 70
  market_score: 65
  product_score: 74
  moat_rating: "weak"
  moat_components:
    technology: "moderate"
    data_network_effects: "none"
    switching_costs: "low"
    brand: "nascent"
    regulatory: "none"
  recurring_revenue_pct: 94
  recurring_revenue_note: >
    94% recurring (annual and monthly subscriptions).
    6% from one-time onboarding/implementation fees.
    Strong recurring base for a seed-stage company.
  total_customers: 38
  enterprise_customers: 4
  mid_market_customers: 12
  smb_customers: 22
  customer_concentration_pct: 28
  customer_concentration_note: >
    Top 3 customers represent 28% of ARR. Moderate
    concentration risk. Largest single customer is
    11% of ARR -- needs to diversify.
  logo_churn_monthly_pct: "8.0"
  logo_churn_annual_pct: "63"
  revenue_churn_monthly_pct: "3.2"
  revenue_churn_annual_pct: "32"
  churn_note: >
    Logo churn is high but expected at seed stage with
    many SMB customers. Revenue churn is significantly
    lower because larger customers have better retention.
    Enterprise cohorts show < 1% monthly revenue churn.
  nps_score: 42
  nps_note: >
    Based on survey of 28 respondents (74% response rate).
    Score is above-average for B2B analytics tools (median
    32). Detractors cite onboarding complexity.
  risk_factors:
    - category: "competitive"
      severity: "high"
      description: >
        Incumbents (Tableau, Looker) rapidly adding AI
        features. Window of differentiation may close in
        18-24 months.
    - category: "concentration"
      severity: "medium"
      description: >
        Top customer is 11% of ARR. Loss would materially
        impact growth trajectory.
    - category: "team"
      severity: "medium"
      description: >
        Key-person dependencies on both founders. VP Eng
        is recent and unproven at this stage.
    - category: "funding"
      severity: "medium"
      description: >
        14 months runway. Will need to raise Series A in
        6-8 months or reduce burn.
  investment_thesis: >
    Bet on AI-native analytics displacing legacy BI tools.
    Strong founder-market fit and early product traction.
    Must demonstrate enterprise sales motion and reduce
    customer concentration before Series A.
  key_metrics_to_watch:
    - "Enterprise customer count (target: 10+ by Q2 2026)"
    - "Logo churn (target: < 5% monthly)"
    - "Customer concentration (target: no single > 8%)"
    - "Gross margin stability above 70%"
  data_confidence: "medium"
  data_sources: >
    Internal scoring model, pitch deck data, Crunchbase,
    customer survey (partial), competitive analysis
  last_updated: "2025-11-15"

